[project]
name = "tailstory-usps"
version = "0.4.0"
description = "USPS API SDK"
authors = [
    { name = "Bradley Reynolds", email = "bradley.reynolds@tailstory.dev" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["niquests>=3.19.1", "xmltodict>=1.0.4"]

[project.urls]
repository = "https://github.com/tailstory/usps-sdk"
documentation = "https://docs.tailstory.dev/usps-sdk/"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nox>=2026.7.11",
    "prek>=0.4.11",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-xmltodict>=1.0.1",
    "ty>=0.0.101",
]
docs = [
    "sphinx>=8.1.0",
    # Theme
    "furo>=2025.12.19",
    # Extensions
    "sphinx-autoapi>=3.8.0",
    "releases>=2.1.1",
]
tests = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    # Extensions
    "pytest-randomly>=4.0.1",
]

[tool.uv]
exclude-newer = "P7D"

[tool.uv.build-backend]
module-name = "usps_sdk"

[tool.ruff]
target-version = "py314"
line-length = 120
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # (Trailing comma missing) - The formatter owns trailing commas
    "CPY001", # (Missing copyright notice at top of file) - No license
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/*" = [
    "INP001", # (File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.) - Docs are not modules
]
"tests/*" = [
    "S101", # (Use of `assert` detected) - Yes, that's the point
]

[tool.ruff.lint.isort]
known-first-party = ["usps_sdk"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
cache_dir = ".cache/mypy"

[tool.coverage.run]
source = ["usps_sdk"]
data_file = ".cache/coverage/.coverage"

[tool.pytest.ini_options]
addopts = "--strict-markers"
cache_dir = ".cache/pytest"
